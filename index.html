<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#142539"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="読書キャプチャ">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png">
<title>読書キャプチャ</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif}*{box-sizing:border-box}body{margin:0;background:#101924;color:white}header{padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;background:#142539;display:flex;align-items:center;justify-content:space-between}h1{margin:0;font-size:19px}.count{color:#c5e0fa;font-size:14px}.stage{position:relative;background:#000;width:100%;height:52dvh;min-height:260px;overflow:hidden;display:flex;align-items:center;justify-content:center}video{height:100%;width:100%;object-fit:contain}.frame{position:absolute;width:83%;height:87%;border:2px solid #ffffffaa;border-radius:10px;pointer-events:none}.hint{position:absolute;bottom:12px;background:#0009;padding:7px 10px;border-radius:15px;font-size:12px;pointer-events:none}button{border:0;border-radius:13px;font-size:16px;font-weight:600;padding:14px 16px;background:#314258;color:white}button:disabled{opacity:.45}button.primary{background:#2675c9}button.shutter{width:76px;height:76px;background:white;border:6px solid #2470c0;border-radius:50%;padding:0}button.shutter:active{transform:scale(.94)}.controls{display:flex;align-items:center;justify-content:space-around;gap:10px;padding:14px 12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 12px}.actions button{min-height:49px}.message{min-height:28px;padding:0 16px 8px;font-size:13px;color:#b5d3f5}.thumbs{display:flex;overflow-x:auto;gap:9px;padding:4px 14px 16px;min-height:100px}.thumb{position:relative;flex:0 0 72px;height:98px;border-radius:7px;overflow:hidden;background:#354251;border:2px solid transparent;padding:0}.thumb.selected{border-color:#65b5ff}.thumb img{width:100%;height:100%;object-fit:cover}.thumb span{position:absolute;left:2px;top:2px;background:#000a;border-radius:3px;font-size:11px;padding:2px 4px}footer{color:#8999aa;font-size:11px;padding:0 16px 24px;line-height:1.5}#preview{position:fixed;inset:0;background:#000e;z-index:10;display:none;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}#preview.visible{display:flex}#preview img{width:100%;height:80%;object-fit:contain}#preview .controls{margin-top:auto}#preview button{font-size:14px}#fileFallback{display:none}
</style>
</head>
<body>
<header><h1>📖 読書キャプチャ</h1><span class="count" id="counter">0 ページ</span></header>
<div class="stage"><video id="camera" autoplay playsinline muted></video><div class="frame"></div><div class="hint">ページを枠内に入れて撮影</div></div>
<div class="controls"><button id="start">カメラ起動</button><button class="shutter" id="shoot" aria-label="ページ撮影" disabled></button><button id="stop" disabled>停止</button></div>
<div class="message" id="message" aria-live="polite">「カメラ起動」を押してください</div>
<div class="actions"><button class="primary" id="share" disabled>画像をまとめて共有</button><button id="save" disabled>画像を保存</button><button id="clear" disabled>すべて削除</button><button id="info">使い方</button></div>
<div class="thumbs" id="thumbs"></div>
<footer>撮影画像はサーバーに送信しません。ブラウザを閉じると画像は消えるため、先に共有か保存をしてください。ChatGPTへの一括添付は共有先の対応に依存します。</footer>
<div id="preview"><img id="large" alt="撮影ページ確認"><div class="controls"><button id="closePreview">戻る</button><button id="deleteOne">このページを削除</button></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id); let stream=null, photos=[], selected=-1, busy=false;
const msg=t=>$('message').textContent=t;
function update(){ $('counter').textContent=photos.length+' ページ'; ['share','save','clear'].forEach(id=>$(id).disabled=!photos.length); $('thumbs').replaceChildren(); photos.forEach((p,i)=>{let b=document.createElement('button');b.className='thumb';b.setAttribute('aria-label',`${i+1}ページを確認`);let img=document.createElement('img');img.src=p.url;let n=document.createElement('span');n.textContent=i+1;b.append(img,n);b.onclick=()=>show(i);$('thumbs').append(b);}); }
async function start(){try {if(!navigator.mediaDevices?.getUserMedia)throw new Error('HTTPSのサイトをSafariで開いてください');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:3840},height:{ideal:2160},frameRate:{ideal:30}}});$('camera').srcObject=stream;await $('camera').play();$('start').disabled=true;$('stop').disabled=false;$('shoot').disabled=false;let track=stream.getVideoTracks()[0], s=track.getSettings();msg(`撮影できます（映像 ${s.width||'?'} × ${s.height||'?'}）`);}catch(e){msg('カメラを起動できません: '+e.message);}}
function stop(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('camera').srcObject=null;$('start').disabled=false;$('stop').disabled=true;$('shoot').disabled=true;msg('カメラを停止しました');}
async function capture(){if(busy||!stream)return;let v=$('camera');if(!v.videoWidth){msg('映像を準備しています');return;}busy=true;$('shoot').disabled=true;try{let canvas=document.createElement('canvas');canvas.width=v.videoWidth;canvas.height=v.videoHeight;canvas.getContext('2d',{alpha:false}).drawImage(v,0,0);let blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.92));if(!blob)throw Error('画像変換に失敗');let url=URL.createObjectURL(blob);photos.push({blob,url});update();msg(`${photos.length}ページ撮影しました`);}catch(e){msg(e.message);}finally{busy=false;$('shoot').disabled=false;}}
function show(i){selected=i;$('large').src=photos[i].url;$('preview').classList.add('visible');}function close(){selected=-1;$('preview').classList.remove('visible');$('large').removeAttribute('src');}
function removeOne(){if(selected<0)return;let p=photos.splice(selected,1)[0];URL.revokeObjectURL(p.url);close();update();msg('ページを削除しました');}
function clear(){if(!confirm(`${photos.length}ページを削除しますか？`))return;photos.forEach(p=>URL.revokeObjectURL(p.url));photos=[];update();msg('撮影画像を削除しました');}
function files(){return photos.map((p,i)=>new File([p.blob],`reading-page-${String(i+1).padStart(3,'0')}.jpg`,{type:'image/jpeg'}));}
async function share(){try{const f=files();if(!navigator.share||!navigator.canShare?.({files:f})){msg('この環境では一括共有できません。「画像を保存」を試してください');return;}await navigator.share({files:f,title:'読書ページ'});msg('共有画面を閉じました。ChatGPT側で画像を確認してください');}catch(e){if(e.name!=='AbortError')msg('共有できません: '+e.message);}}
async function save(){try{const f=files();if(navigator.share&&navigator.canShare?.({files:f})){await navigator.share({files:f,title:'読書ページを保存'});msg('共有画面から「ファイルに保存」を選択してください');return;}for(let i=0;i<photos.length;i++){let a=document.createElement('a');a.href=photos[i].url;a.download=f[i].name;a.click();}msg('保存を開始しました。複数ファイルの保存は端末の制限で失敗する場合があります');}catch(e){if(e.name!=='AbortError')msg('保存できません: '+e.message);}}
$('start').onclick=start;$('stop').onclick=stop;$('shoot').onclick=capture;$('share').onclick=share;$('save').onclick=save;$('clear').onclick=clear;$('closePreview').onclick=close;$('deleteOne').onclick=removeOne;$('info').onclick=()=>alert('①カメラ起動→権限を許可 ②白い丸で連続撮影 ③下の小画像をタップして確認・削除 ④画像をまとめて共有。無音動作はiPhone実機で確認してください。撮影中は画面を閉じないでください。');window.addEventListener('pagehide',()=>{if(stream)stop();});
</script>
</body></html>
