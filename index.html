<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#142539"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="読書キャプチャ">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png">
<title>読書キャプチャ</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif}*{box-sizing:border-box}body{margin:0;background:#101924;color:white}header{padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;background:#142539;display:flex;align-items:center;justify-content:space-between}h1{margin:0;font-size:19px}.count{color:#c5e0fa;font-size:14px}.stage{position:relative;background:#000;width:100%;height:48dvh;min-height:260px;overflow:hidden;display:flex;align-items:center;justify-content:center}video{height:100%;width:100%;object-fit:contain}.frame{position:absolute;width:95%;height:91%;border:2px solid #ffffffaa;border-radius:10px;pointer-events:none}.center-guide{position:absolute;left:50%;top:7%;height:86%;border-left:2px dashed #53b5ff;pointer-events:none;opacity:.95}.hint{position:absolute;bottom:12px;background:#0009;padding:7px 10px;border-radius:15px;font-size:12px;pointer-events:none}button{border:0;border-radius:13px;font-size:16px;font-weight:600;padding:14px 16px;background:#314258;color:white}button:disabled{opacity:.45}button.primary{background:#2675c9}button.shutter{width:76px;height:76px;background:white;border:6px solid #2470c0;border-radius:50%;padding:0}button.shutter:active{transform:scale(.94)}.controls{display:flex;align-items:center;justify-content:space-around;gap:10px;padding:14px 12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 12px}.actions button{min-height:49px}.message{min-height:28px;padding:0 16px 8px;font-size:13px;color:#b5d3f5}.thumbs{display:flex;overflow-x:auto;gap:9px;padding:4px 14px 16px;min-height:100px}.thumb{position:relative;flex:0 0 72px;height:98px;border-radius:7px;overflow:hidden;background:#354251;border:2px solid transparent;padding:0}.thumb.selected{border-color:#65b5ff}.thumb img{width:100%;height:100%;object-fit:cover}.thumb span{position:absolute;left:2px;top:2px;background:#000a;border-radius:3px;font-size:11px;padding:2px 4px}footer{color:#8999aa;font-size:11px;padding:0 16px 24px;line-height:1.5}#preview{position:fixed;inset:0;background:#000e;z-index:10;display:none;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}#preview.visible{display:flex}#preview .image-area{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;touch-action:pan-x pan-y}#preview img{max-width:100%;max-height:100%;object-fit:contain}#preview img.zoomed{max-width:none;max-height:none;width:200%;height:auto}#preview .controls{flex-wrap:wrap}#preview .controls button{flex:1 1 28%;white-space:nowrap}#preview .controls{margin-top:auto}#preview button{font-size:14px}#fileFallback{display:none}.camera-status{font-size:12px;color:#b9dcff;padding:5px 15px;background:#15263a}.orientation-setting{display:flex;align-items:center;gap:9px;padding:9px 14px;background:#1b2b3e;font-size:12px}.orientation-setting select{flex:1;min-width:0;background:#314258;color:white;border:1px solid #627a95;border-radius:8px;padding:9px 4px;font-size:12px}.version{color:#8fbdf4}
</style>
</head>
<body>
<header><h1>📖 読書キャプチャ</h1><span class="count" id="counter">0 / 10 枚</span></header>
<div class="stage"><video id="camera" autoplay playsinline muted></video><div class="frame"></div><div class="center-guide"></div><div class="hint">見開きを入れて撮影（縦持ちも中央の青線は縦）</div></div>
<div class="orientation-setting"><label for="portraitRotation">撮影画像の回転設定</label><select id="portraitRotation"><option value="0">回転しない（初期設定）</option><option value="90">右90°</option><option value="-90">左90°</option></select><span class="version">v2.4</span></div><div class="orientation-setting"><label for="cameraSelect">背面カメラ</label><select id="cameraSelect" disabled><option value="">起動後に選択</option></select><span class="version">v2.2</span></div><div class="camera-status" id="cameraStatus" aria-live="polite">カメラ未起動</div><div class="controls"><button id="start">カメラ起動</button><button class="shutter" id="shoot" aria-label="ページ撮影" disabled></button><button id="stop" disabled>停止</button></div>
<div class="message" id="message" aria-live="polite">「カメラ起動」を押してください</div>
<div class="actions"><button class="primary" id="share" disabled>画像をまとめて共有</button><button id="save" disabled>画像を保存</button><button id="clear" disabled>すべて削除</button><button id="info">使い方</button></div>
<div class="thumbs" id="thumbs"></div>
<footer>1セット10枚（見開きで約20ページ）。保存を確認するまで削除しないでください。撮影画像はサーバーに送信しません。ブラウザを閉じると画像は消えるため、先に共有か保存をしてください。ChatGPTへの一括添付は共有先の対応に依存します。</footer>
<div id="preview"><div class="image-area" id="imageArea"><img id="large" alt="撮影画像の確認"></div><div class="controls"><button id="closePreview">戻る</button><button id="rotateLeft">↶ 左90°</button><button id="rotateRight">↷ 右90°</button><button id="rotateFlip">180°反転</button><button id="zoom">拡大</button><button id="deleteOne">この画像を削除</button></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id); let stream=null, photos=[], selected=-1, busy=false;
const msg=t=>$('message').textContent=t;const cameraKey='readingCameraLabelV23';let deviceChoices=[];function labelCamera(d){return d.label||'カメラ';}function saveCameraChoice(){try{const d=deviceChoices.find(d=>d.deviceId===$('cameraSelect').value);if(d)localStorage.setItem(cameraKey,d.label);}catch(e){}}function selectedCameraStatus(){const d=deviceChoices.find(d=>d.deviceId===$('cameraSelect').value);$('cameraStatus').textContent='使用中: '+(d?labelCamera(d):'背面カメラ')+'（レンズ種別は表示名を参考に確認）';}try{const saved=localStorage.getItem('readingPortraitRotation');if(['0','90','-90'].includes(saved))$('portraitRotation').value=saved;}catch(e){}$('portraitRotation').onchange=()=>{try{localStorage.setItem('readingPortraitRotation',$('portraitRotation').value);}catch(e){}};
function update(){ $('counter').textContent=photos.length+' / 10 枚（約'+(photos.length*2)+'ページ）'; ['share','save','clear'].forEach(id=>$(id).disabled=!photos.length); $('thumbs').replaceChildren(); photos.forEach((p,i)=>{let b=document.createElement('button');b.className='thumb';b.setAttribute('aria-label',`${i+1}枚目を確認`);let img=document.createElement('img');img.src=p.url;let n=document.createElement('span');n.textContent=i+1;b.append(img,n);b.onclick=()=>show(i);$('thumbs').append(b);}); }
async function start(){try {if(!navigator.mediaDevices?.getUserMedia)throw new Error('HTTPSのサイトをSafariで開いてください');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:2880},height:{ideal:2160},aspectRatio:{ideal:4/3},frameRate:{ideal:30}}});$('camera').srcObject=stream;await $('camera').play();$('start').disabled=true;$('stop').disabled=false;$('shoot').disabled=false;let track=stream.getVideoTracks()[0], s=track.getSettings();msg(`4:3優先｜実映像 ${s.width||'?'} × ${s.height||'?'}（比率 ${(s.width&&s.height?(s.width/s.height).toFixed(2):'?')}）`);await listCameras();}catch(e){msg('カメラを起動できません: '+e.message);}}
async function listCameras(){
 try{
  const all=await navigator.mediaDevices.enumerateDevices();
  const cams=all.filter(d=>d.kind==='videoinput');
  const rear=cams.filter(d=>/back|rear|environment|背面|後面|広角|ultra|wide|camera [012]/i.test(d.label));
  const candidates=rear.length?rear:cams;deviceChoices=candidates;
  const sel=$('cameraSelect'), current=stream?.getVideoTracks()[0]?.getSettings()?.deviceId||'';
  sel.replaceChildren();
  candidates.forEach((d,i)=>{const o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label||'カメラ '+(i+1);sel.append(o);});
  sel.disabled=candidates.length<2;
  if([...sel.options].some(o=>o.value===current))sel.value=current;
  let saved='';try{saved=localStorage.getItem(cameraKey)||'';}catch(e){}
  const desired=candidates.find(d=>d.label===saved);
  if(desired&&desired.deviceId!==current){await switchCamera(desired.deviceId);sel.value=desired.deviceId;}else if(current){selectedCameraStatus();}
  msg('カメラ候補 '+candidates.length+'台。選択したカメラを次回も優先します');
 }catch(e){msg('カメラ一覧取得不可: '+e.message);}
}
async function switchCamera(id){
 if(!id)return;
 const old=stream;
 if(old)old.getTracks().forEach(t=>t.stop());
 stream=null;$('shoot').disabled=true;$('stop').disabled=true;
 try{
  stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{deviceId:{exact:id},width:{ideal:2880},height:{ideal:2160},aspectRatio:{ideal:4/3},frameRate:{ideal:30}}});
  $('camera').srcObject=stream;await $('camera').play();
  $('shoot').disabled=photos.length>=10;$('stop').disabled=false;$('start').disabled=true;
  const set=stream.getVideoTracks()[0].getSettings();
  $('cameraSelect').value=id;saveCameraChoice();selectedCameraStatus();msg('4:3優先｜実映像 '+(set.width||'?')+' × '+(set.height||'?')+'（比率 '+(set.width&&set.height?(set.width/set.height).toFixed(2):'?')+'）。画角を確認してください');
 }catch(e){msg('切替失敗: '+e.message+'。標準カメラを再起動してください');$('start').disabled=false;}
}
$('cameraSelect').onchange=()=>switchCamera($('cameraSelect').value);
function stop(){$('cameraStatus').textContent='カメラ停止中';if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('camera').srcObject=null;$('start').disabled=false;$('stop').disabled=true;$('shoot').disabled=true;$('cameraSelect').disabled=true;msg('カメラを停止しました');}
async function capture(){if(busy||!stream)return;if(photos.length>=10){msg('10枚になりました。保存してから「すべて削除」で次の10枚へ進んでください');return;}let v=$('camera');if(!v.videoWidth){msg('映像を準備しています');return;}busy=true;$('shoot').disabled=true;try{let canvas=document.createElement('canvas');const isPortrait=v.videoHeight>v.videoWidth;const deg=isPortrait?Number($('portraitRotation').value):0;const turn=Math.abs(deg)===90;canvas.width=turn?v.videoHeight:v.videoWidth;canvas.height=turn?v.videoWidth:v.videoHeight;const ctx=canvas.getContext('2d',{alpha:false});if(deg){ctx.translate(canvas.width/2,canvas.height/2);ctx.rotate(deg*Math.PI/180);ctx.drawImage(v,-v.videoWidth/2,-v.videoHeight/2);}else{ctx.drawImage(v,0,0);}let blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.92));if(!blob)throw Error('画像変換に失敗');let url=URL.createObjectURL(blob);photos.push({blob,url});update();msg(`${photos.length}/10枚撮影（画像 ${canvas.width}×${canvas.height}・比率 ${(canvas.width/canvas.height).toFixed(2)}）`);if(photos.length===10){msg('10枚になりました。先に画像を保存してください');}}catch(e){msg(e.message);}finally{busy=false;$('shoot').disabled=!stream||photos.length>=10;}}
function show(i){selected=i;$('large').classList.remove('zoomed');$('zoom').textContent='拡大';$('large').src=photos[i].url;$('preview').classList.add('visible');}function close(){selected=-1;$('preview').classList.remove('visible');$('large').removeAttribute('src');}
async function rotate(deg){if(selected<0||busy)return;busy=true;try{const p=photos[selected],img=new Image();img.src=p.url;await img.decode();const canvas=document.createElement('canvas');const side=Math.abs(deg)===90;canvas.width=side?img.naturalHeight:img.naturalWidth;canvas.height=side?img.naturalWidth:img.naturalHeight;const ctx=canvas.getContext('2d',{alpha:false});ctx.translate(canvas.width/2,canvas.height/2);ctx.rotate(deg*Math.PI/180);ctx.drawImage(img,-img.naturalWidth/2,-img.naturalHeight/2);const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.94));if(!blob)throw new Error('回転処理に失敗');const url=URL.createObjectURL(blob);URL.revokeObjectURL(p.url);photos[selected]={blob,url};$('large').src=url;$('large').classList.remove('zoomed');$('zoom').textContent='拡大';update();msg('画像を回転しました');}catch(e){msg('回転できません: '+e.message);}finally{busy=false;}}
function removeOne(){if(selected<0)return;let p=photos.splice(selected,1)[0];URL.revokeObjectURL(p.url);close();update();$('shoot').disabled=!stream;msg('画像を削除しました');}
function clear(){if(!confirm(`${photos.length}枚を削除しますか？ 保存済みか確認してください。`))return;photos.forEach(p=>URL.revokeObjectURL(p.url));photos=[];update();$('shoot').disabled=!stream;msg('撮影画像を削除しました。次の10枚を撮影できます');}
function files(){return photos.map((p,i)=>new File([p.blob],`reading-page-${String(i+1).padStart(3,'0')}.jpg`,{type:'image/jpeg'}));}
async function share(){try{const f=files();if(!navigator.share||!navigator.canShare?.({files:f})){msg('この環境では一括共有できません。「画像を保存」を試してください');return;}await navigator.share({files:f,title:'読書ページ'});msg('共有画面を閉じました。ChatGPT側で画像を確認してください');}catch(e){if(e.name!=='AbortError')msg('共有できません: '+e.message);}}
async function save(){try{const f=files();if(navigator.share&&navigator.canShare?.({files:f})){await navigator.share({files:f,title:'読書ページを保存'});msg('共有画面から「ファイルに保存」を選択してください');return;}for(let i=0;i<photos.length;i++){let a=document.createElement('a');a.href=photos[i].url;a.download=f[i].name;a.click();}msg('保存を開始しました。複数ファイルの保存は端末の制限で失敗する場合があります');}catch(e){if(e.name!=='AbortError')msg('保存できません: '+e.message);}}
$('start').onclick=start;$('stop').onclick=stop;$('shoot').onclick=capture;$('share').onclick=share;$('save').onclick=save;$('clear').onclick=clear;$('closePreview').onclick=close;$('deleteOne').onclick=removeOne;$('rotateLeft').onclick=()=>rotate(-90);$('rotateRight').onclick=()=>rotate(90);$('rotateFlip').onclick=()=>rotate(180);$('zoom').onclick=()=>{const z=$('large').classList.toggle('zoomed');$('zoom').textContent=z?'縮小':'拡大';};$('info').onclick=()=>alert('①カメラ起動→背面カメラを切替可能なら選択 ②見開きで10枚まで撮影 ③選択したカメラを次回も優先します。カメラ名だけで超広角とは断定できないので画角を確認してください。通常は回転せず保存し、必要に応じて回転してください ④サムネイルをタップして拡大・回転・削除 ④「画像を保存」して写真アプリ等に保存 ⑤保存を確認して「すべて削除」で次の10枚へ。ChatGPTでは写真アプリから画像を添付します。');window.addEventListener('pagehide',()=>{if(stream)stop();});
</script>
</body></html>
